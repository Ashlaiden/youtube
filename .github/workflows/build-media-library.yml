name: Download And Publish Media

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            python3 \
            python3-pip

          python3 -m pip install --upgrade yt-dlp

      - name: Prepare folders
        run: |
          mkdir -p downloads/short_videos
          mkdir -p downloads/long_videos
          mkdir -p assets

      - name: Download videos
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail

          cat > cookies.txt <<< "$YT_COOKIES"

          sanitize_filename() {
            echo "$1" \
              | sed 's/[<>:"\/\\|?*]//g' \
              | sed 's/  */ /g' \
              | sed 's/^ *//;s/ *$//'
          }

          download_video() {
            local url="$1"
            local type="$2"

            local base_dir

            if [ "$type" = "short" ]; then
              base_dir="downloads/short_videos"
            else
              base_dir="downloads/long_videos"
            fi

            yt-dlp \
              --cookies cookies.txt \
              --no-playlist \
              --merge-output-format mp4 \
              --format "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b" \
              --embed-metadata \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "${base_dir}/%(title)s/%(title)s_%(id)s.%(ext)s" \
              "$url"
          }

          if [ -f long_videos.txt ]; then
            while IFS= read -r url || [ -n "$url" ]; do
              [ -z "$url" ] && continue
              download_video "$url" "long"
            done < long_videos.txt
          fi

          if [ -f short_videos.txt ]; then
            while IFS= read -r url || [ -n "$url" ]; do
              [ -z "$url" ] && continue
              download_video "$url" "short"
            done < short_videos.txt
          fi

      - name: Split oversized videos
        run: |
          set -euo pipefail

          TARGET_MB=95
          TARGET_BYTES=$((TARGET_MB * 1024 * 1024))

          AUDIO_BITRATE_KBPS=128

          find downloads -type f -name "*.mp4" | while read -r input_file; do

            file_size=$(stat -c%s "$input_file")

            if [ "$file_size" -le "$TARGET_BYTES" ]; then
              echo "✅ No split needed: $input_file"
              continue
            fi

            echo "⚠️ Splitting: $input_file ($file_size bytes)"

            duration=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$input_file")

            duration=${duration%.*}

            if [ -z "$duration" ] || [ "$duration" -le 0 ]; then
              echo "❌ Could not detect duration"
              exit 1
            fi

            total_bitrate=$(( file_size * 8 / duration ))

            target_part_bytes=$(( TARGET_BYTES - (2 * 1024 * 1024) ))

            estimated_parts=$(( (file_size + target_part_bytes - 1) / target_part_bytes ))

            if [ "$estimated_parts" -lt 2 ]; then
              estimated_parts=2
            fi

            segment_time=$(( duration / estimated_parts ))

            if [ "$segment_time" -lt 5 ]; then
              segment_time=5
            fi

            basename_noext="${input_file%.mp4}"

            rm -f "${basename_noext}"_part*.mp4

            start=0
            part=0

            while [ "$start" -lt "$duration" ]; do

              part_len="$segment_time"

              remaining=$(( duration - start ))

              if [ "$remaining" -lt "$part_len" ]; then
                part_len="$remaining"
              fi

              part_file=$(printf "%s_part%03d.mp4" "$basename_noext" "$part")

              part_vbitrate=$(( (target_part_bytes * 8 / part_len) - (AUDIO_BITRATE_KBPS * 1000) ))

              if [ "$part_vbitrate" -lt 300000 ]; then
                part_vbitrate=300000
              fi

              echo "➡️ Part $((part + 1)): start=${start}s len=${part_len}s bitrate=${part_vbitrate}"

              ffmpeg \
                -nostdin \
                -hide_banner \
                -loglevel error \
                -y \
                -ss "$start" \
                -i "$input_file" \
                -t "$part_len" \
                -map 0:v:0 \
                -map 0:a? \
                -c:v libx264 \
                -preset ultrafast \
                -threads 0 \
                -pix_fmt yuv420p \
                -b:v "$part_vbitrate" \
                -maxrate "$part_vbitrate" \
                -bufsize $((part_vbitrate * 2)) \
                -c:a aac \
                -b:a "${AUDIO_BITRATE_KBPS}k" \
                -movflags +faststart \
                "$part_file"

              new_size=$(stat -c%s "$part_file")

              if [ "$new_size" -gt "$TARGET_BYTES" ]; then
                echo "❌ Split part still oversized: $part_file"
                exit 1
              fi

              start=$(( start + part_len ))
              part=$(( part + 1 ))

            done

            rm -f "$input_file"

            echo "✅ Split successful: $input_file"

          done

      - name: Generate library.json
        run: |
          set -euo pipefail

          python3 << 'PYTHON'
          import json
          import re
          from pathlib import Path
          
          ROOT = Path("downloads")
          VIDEO_EXTS = {".mp4", ".mkv", ".webm", ".mov", ".m4v"}
          IMAGE_EXTS = {".jpg", ".jpeg", ".png", ".webp"}
          
          def part_sort_key(path):
              m = re.search(r"_part(\d+)", path.stem)
              return int(m.group(1)) if m else 999999
          
          def scan_long_section():
              section_dir = ROOT / "long_videos"
              if not section_dir.exists():
                  return []
          
              items = []
          
              for folder in sorted(section_dir.iterdir(), key=lambda p: p.name.lower()):
                  if not folder.is_dir():
                      continue
          
                  files = list(folder.iterdir())
          
                  thumbnail = next((f for f in files if f.suffix.lower() in IMAGE_EXTS), None)
                  full_video = next((f for f in files if f.suffix.lower() in VIDEO_EXTS and "_part" not in f.stem), None)
                  parts = sorted(
                      [f for f in files if f.suffix.lower() in VIDEO_EXTS and "_part" in f.stem],
                      key=part_sort_key
                  )
          
                  items.append({
                      "id": folder.name,
                      "title": folder.name,
                      "kind": "long",
                      "thumbnail": str(thumbnail).replace("\\", "/") if thumbnail else None,
                      "full": str(full_video).replace("\\", "/") if full_video else None,
                      "parts": [str(p).replace("\\", "/") for p in parts]
                  })
          
              return items
          
          def scan_short_section():
              section_dir = ROOT / "short_videos"
              if not section_dir.exists():
                  return []
          
              files = [f for f in section_dir.iterdir() if f.is_file()]
              groups = {}
          
              for f in files:
                  if f.suffix.lower() not in VIDEO_EXTS | IMAGE_EXTS:
                      continue
          
                  stem = f.stem
                  base = re.sub(r"_part\d+$", "", stem)
                  base = re.sub(r"_+$", "", base)
          
                  if base not in groups:
                      groups[base] = {
                          "id": base,
                          "title": base,
                          "kind": "short",
                          "thumbnail": None,
                          "full": None,
                          "parts": []
                      }
          
                  if f.suffix.lower() in IMAGE_EXTS and groups[base]["thumbnail"] is None:
                      groups[base]["thumbnail"] = str(f).replace("\\", "/")
          
                  if f.suffix.lower() in VIDEO_EXTS:
                      if "_part" in stem:
                          groups[base]["parts"].append((part_sort_key(f), str(f).replace("\\", "/")))
                      else:
                          groups[base]["full"] = str(f).replace("\\", "/")
          
              result = []
              for g in groups.values():
                  g["parts"] = [p for _, p in sorted(g["parts"], key=lambda x: x[0])]
                  result.append(g)
          
              result.sort(key=lambda x: x["title"].lower())
              return result
          
          manifest = {
              "sections": {
                  "long": scan_long_section(),
                  "short": scan_short_section(),
              }
          }
          
          Path("assets").mkdir(exist_ok=True)
          with open("assets/library.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PYTHON

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update media library"

          git push
