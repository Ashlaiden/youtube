name: Media Library Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq python3

      - name: Setup yt-dlp
        run: |
          python3 -m pip install -U yt-dlp

      - name: Download videos
        run: |
          set -euo pipefail

          mkdir -p downloads/long_videos
          mkdir -p downloads/short_videos

          download_video() {
            local URL="$1"
            local TYPE="$2"

            if [ "$TYPE" = "short" ]; then
              OUTDIR="downloads/short_videos"
            else
              OUTDIR="downloads/long_videos/%(title).200B"
            fi

            yt-dlp \
              --no-progress \
              --ignore-errors \
              --no-warnings \
              --merge-output-format mp4 \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --embed-metadata \
              --restrict-filenames \
              --windows-filenames \
              --trim-filenames 200 \
              -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" \
              -o "${OUTDIR}/%(title).200B_%(id)s.%(ext)s" \
              "$URL"
          }

          #
          # EXAMPLES
          # Replace these with your own sources
          #

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            download_video "$URL" "long"
          done < long_videos.txt

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            download_video "$URL" "short"
          done < short_videos.txt

      - name: Split oversized videos
        run: |
          set -euo pipefail

          TARGET_MB=24
          TARGET_BYTES=$((TARGET_MB * 1024 * 1024))

          find downloads -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) | while read -r FILE; do

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -le "$TARGET_BYTES" ]; then
              echo "✅ No split needed: $FILE"
              continue
            fi

            DIR=$(dirname "$FILE")
            EXT="${FILE##*.}"
            BASENAME=$(basename "$FILE" ".$EXT")

            DURATION=$(ffprobe -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FILE")

            DURATION=${DURATION%.*}

            if [ -z "$DURATION" ] || [ "$DURATION" -le 0 ]; then
              echo "❌ Could not detect duration: $FILE"
              continue
            fi

            PARTS=$(( (SIZE + TARGET_BYTES - 1) / TARGET_BYTES ))

            if [ "$PARTS" -lt 2 ]; then
              PARTS=2
            fi

            SEGMENT_TIME=$(( DURATION / PARTS ))

            if [ "$SEGMENT_TIME" -lt 5 ]; then
              SEGMENT_TIME=5
            fi

            echo "⚠️ Splitting: $FILE"

            rm -f "${DIR}/${BASENAME}"_part*."$EXT"

            ffmpeg \
              -hide_banner \
              -loglevel error \
              -i "$FILE" \
              -c copy \
              -map 0 \
              -f segment \
              -segment_time "$SEGMENT_TIME" \
              -reset_timestamps 1 \
              "${DIR}/${BASENAME}_part%03d.${EXT}"

            PART_COUNT=$(find "$DIR" -maxdepth 1 -type f -name "${BASENAME}_part*.${EXT}" | wc -l)

            if [ "$PART_COUNT" -gt 0 ]; then
              rm -f "$FILE"
              echo "✅ Split successful: $FILE"
            else
              echo "❌ Split failed: $FILE"
              exit 1
            fi
          done

      - name: Build library manifest
        run: |
          set -euo pipefail

          mkdir -p assets

          python3 << 'PYTHON'
          import json
          import re
          from pathlib import Path

          ROOT = Path("downloads")

          VIDEO_EXTS = {".mp4", ".mkv", ".webm", ".mov", ".m4v"}
          IMAGE_EXTS = {".jpg", ".jpeg", ".png", ".webp"}

          def normalize(path):
              return str(path).replace("\\", "/")

          def part_sort_key(path):
              m = re.search(r"_part(\d+)", path.stem)
              return int(m.group(1)) if m else 999999

          def scan_long_section():
              section_dir = ROOT / "long_videos"

              if not section_dir.exists():
                  return []

              items = []

              for folder in sorted(section_dir.iterdir(), key=lambda p: p.name.lower()):

                  if not folder.is_dir():
                      continue

                  files = list(folder.iterdir())

                  thumbnail = next(
                      (f for f in files if f.suffix.lower() in IMAGE_EXTS),
                      None
                  )

                  full_video = next(
                      (
                          f for f in files
                          if f.suffix.lower() in VIDEO_EXTS
                          and "_part" not in f.stem
                      ),
                      None
                  )

                  parts = sorted(
                      [
                          f for f in files
                          if f.suffix.lower() in VIDEO_EXTS
                          and "_part" in f.stem
                      ],
                      key=part_sort_key
                  )

                  items.append({
                      "id": folder.name,
                      "title": folder.name,
                      "kind": "long",
                      "thumbnail": normalize(thumbnail) if thumbnail else None,
                      "full": normalize(full_video) if full_video else None,
                      "parts": [normalize(p) for p in parts]
                  })

              return items

          def scan_short_section():
              section_dir = ROOT / "short_videos"

              if not section_dir.exists():
                  return []

              files = [f for f in section_dir.iterdir() if f.is_file()]

              groups = {}

              for f in files:

                  if f.suffix.lower() not in VIDEO_EXTS | IMAGE_EXTS:
                      continue

                  stem = f.stem

                  base = re.sub(r"_part\d+$", "", stem)
                  base = re.sub(r"_+$", "", base)

                  if base not in groups:
                      groups[base] = {
                          "id": base,
                          "title": base,
                          "kind": "short",
                          "thumbnail": None,
                          "full": None,
                          "parts": []
                      }

                  if f.suffix.lower() in IMAGE_EXTS:
                      if groups[base]["thumbnail"] is None:
                          groups[base]["thumbnail"] = normalize(f)

                  if f.suffix.lower() in VIDEO_EXTS:

                      if "_part" in stem:
                          groups[base]["parts"].append(
                              (part_sort_key(f), normalize(f))
                          )
                      else:
                          groups[base]["full"] = normalize(f)

              result = []

              for g in groups.values():
                  g["parts"] = [
                      p for _, p in sorted(g["parts"], key=lambda x: x[0])
                  ]
                  result.append(g)

              result.sort(key=lambda x: x["title"].lower())

              return result

          manifest = {
              "sections": {
                  "long": scan_long_section(),
                  "short": scan_short_section()
              }
          }

          with open("assets/library.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          print("✅ library.json generated")
          PYTHON

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update media library"
          git push
