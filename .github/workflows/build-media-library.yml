name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TARGET_MB: "19"

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg, bc, yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install -U "yt-dlp[default]"

      - name: Create cookies file from Secret
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s\n' "${{ secrets.YT_COOKIES }}" > cookies.txt
            if [ ! -s cookies.txt ]; then
              echo "❌ فایل کوکی خالی است!"
              exit 1
            fi
          fi

      - name: Split playlist into long and short temporary files
        run: |
          set -euo pipefail

          if [ ! -f playlist.txt ]; then
            echo "⚠️ فایل playlist.txt یافت نشد. لطفاً آن را در ریشه مخزن ایجاد کنید."
            exit 1
          fi

          rm -f long_temp.txt short_temp.txt
          : > long_temp.txt
          : > short_temp.txt

          awk '
            BEGIN { mode = "" }
            /^[[:space:]]*#long[[:space:]]*$/  { mode = "long";  next }
            /^[[:space:]]*#short[[:space:]]*$/ { mode = "short"; next }
            /^[[:space:]]*#/ { next }
            NF == 0 { next }
            {
              gsub(/\r$/, "")
              if (mode == "long")  print >> "long_temp.txt"
              if (mode == "short") print >> "short_temp.txt"
            }
          ' playlist.txt

          echo "✅ لینک‌های بلند استخراج شده: $(wc -l < long_temp.txt | tr -d ' ') عدد"
          echo "✅ لینک‌های کوتاه استخراج شده: $(wc -l < short_temp.txt | tr -d ' ') عدد"

      - name: Download long videos
        run: |
          set -euo pipefail

          if [ -s long_temp.txt ]; then
            mkdir -p downloads/long_videos

            COOKIE_ARGS=()
            if [ -s cookies.txt ]; then
              COOKIE_ARGS=(--cookies cookies.txt)
            fi

            yt-dlp \
              --js-runtimes node \
              "${COOKIE_ARGS[@]}" \
              --batch-file long_temp.txt \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "downloads/long_videos/%(title)s/%(title)s_%(id)s.%(ext)s" \
              --output "thumbnail:downloads/long_videos/%(title)s/%(title)s_%(id)s.%(ext)s" \
              --continue \
              --restrict-filenames \
              --merge-output-format mp4
          else
            echo "⏩ هیچ لینک بلندی برای دانلود وجود ندارد."
          fi

      - name: Download short videos
        run: |
          set -euo pipefail

          if [ -s short_temp.txt ]; then
            mkdir -p downloads/short_videos

            COOKIE_ARGS=()
            if [ -s cookies.txt ]; then
              COOKIE_ARGS=(--cookies cookies.txt)
            fi

            yt-dlp \
              --js-runtimes node \
              "${COOKIE_ARGS[@]}" \
              --batch-file short_temp.txt \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "downloads/short_videos/%(title)s_%(id)s.%(ext)s" \
              --output "thumbnail:downloads/short_videos/%(title)s_%(id)s.%(ext)s" \
              --continue \
              --restrict-filenames \
              --merge-output-format mp4
          else
            echo "⏩ هیچ لینک کوتاهی برای دانلود وجود ندارد."
          fi

      - name: Split videos into chunks
        run: |
          set -euo pipefail

          TARGET_BYTES=$((TARGET_MB * 1024 * 1024))

          split_video() {
            local input_file="$1"
            [ -f "$input_file" ] || return 0

            local dir base name ext size_bytes duration segment_time attempt parts_count max_part_size part

            dir="$(dirname "$input_file")"
            base="$(basename "$input_file")"
            name="${base%.*}"
            ext="${base##*.}"

            size_bytes="$(stat -c%s "$input_file")"

            if [ "$size_bytes" -le "$TARGET_BYTES" ]; then
              echo "✅ No split needed: $input_file"
              return 0
            fi

            duration="$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$input_file" | awk '{print int($1+0.5)}' || true)"

            if [ -z "${duration:-}" ] || [ "$duration" -le 0 ]; then
              duration=60
            fi

            segment_time="$(awk -v target="$TARGET_BYTES" -v size="$size_bytes" -v duration="$duration" '
              BEGIN {
                t = (target / size) * duration * 0.95
                if (t < 3) t = 3
                printf "%.0f", t
              }
            ')"

            if [ -z "${segment_time:-}" ] || [ "$segment_time" -lt 3 ]; then
              segment_time=3
            fi

            echo "⚠️ Splitting: $input_file (${size_bytes} bytes) with initial segment_time=${segment_time}s"

            for attempt in 1 2 3 4 5 6; do
              rm -f "${dir}/${name}_part"*".${ext}" 2>/dev/null || true

              ffmpeg -hide_banner -loglevel error -y \
                -i "$input_file" \
                -map 0 -c copy \
                -f segment \
                -segment_time "$segment_time" \
                -reset_timestamps 1 \
                "${dir}/${name}_part%03d.${ext}"

              parts_count=$(find "$dir" -maxdepth 1 -type f -name "${name}_part*.${ext}" | wc -l | tr -d ' ')

              if [ "$parts_count" -eq 0 ]; then
                echo "⚠️ هیچ پارت خروجی تولید نشد. کاهش زمان بخش..."
                segment_time=$((segment_time / 2))
                [ "$segment_time" -lt 3 ] && segment_time=3
                continue
              fi

              max_part_size=0
              while IFS= read -r -d '' part; do
                part_size=$(stat -c%s "$part")
                if [ "$part_size" -gt "$max_part_size" ]; then
                  max_part_size="$part_size"
                fi
              done < <(find "$dir" -maxdepth 1 -type f -name "${name}_part*.${ext}" -print0)

              if [ "$max_part_size" -le "$TARGET_BYTES" ]; then
                echo "✅ Split successful: $input_file"
                rm -f "$input_file"
                return 0
              fi

              echo "⚠️ بعضی پارت‌ها هنوز بزرگ‌تر از TARGET_MB هستند. retry با segment_time کوچکتر..."
              rm -f "${dir}/${name}_part"*".${ext}" 2>/dev/null || true
              segment_time=$((segment_time * 80 / 100))
              [ "$segment_time" -lt 3 ] && segment_time=3
            done

            echo "❌ Split failed to keep parts under ${TARGET_MB}MB: $input_file"
            exit 1
          }

          while IFS= read -r -d '' video; do
            case "$video" in
              *_part*.mp4|*_part*.mkv|*_part*.webm|*_part*.mov|*_part*.m4v)
                continue
                ;;
            esac

            split_video "$video"
          done < <(
            find downloads/long_videos downloads/short_videos \
              -type f \
              \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" -o -iname "*.mov" -o -iname "*.m4v" \) \
              -print0
          )

      - name: Verify and cleanup oversized originals
        run: |
          set -euo pipefail

          while IFS= read -r -d '' video; do
            size_bytes=$(stat -c%s "$video")
            if [ "$size_bytes" -gt 104857600 ]; then
              base="${video%.*}"

              if ls "${base}_part"* >/dev/null 2>&1; then
                echo "🧹 Removing oversized original: $video"
                rm -f "$video"
              else
                echo "❌ Oversized file still exists and was not split: $video"
                exit 1
              fi
            fi
          done < <(find downloads -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" -o -iname "*.mov" -o -iname "*.m4v" \) -print0)

      - name: Generate fallback thumbnails
        run: |
          set -euo pipefail

          create_thumbnail() {
            local folder="$1"

            local existing_thumb
            existing_thumb="$(find "$folder" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | head -n 1 || true)"

            if [ -n "$existing_thumb" ]; then
              return 0
            fi

            local video
            video="$(find "$folder" -maxdepth 1 -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" -o -iname "*.mov" -o -iname "*.m4v" \) ! -name "*_part*" | head -n 1 || true)"

            if [ -z "$video" ]; then
              return 0
            fi

            ffmpeg -hide_banner -loglevel error -y \
              -ss 00:00:01 \
              -i "$video" \
              -frames:v 1 \
              -q:v 2 \
              "$folder/thumbnail.jpg" || true
          }

          find downloads/long_videos downloads/short_videos -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
            create_thumbnail "$dir"
          done

      - name: Build library manifest
        run: |
          python3 << 'PYTHON'
          import json
          import re
          from pathlib import Path

          VIDEO_EXTS = {".mp4", ".mkv", ".webm", ".mov", ".m4v"}
          IMAGE_EXTS = {".jpg", ".jpeg", ".png", ".webp"}
          ROOT = Path("downloads")

          def part_sort_key(path):
              m = re.search(r"_part(\d+)", path.stem)
              return int(m.group(1)) if m else 999999

          def scan_section(section_name):
              section_dir = ROOT / section_name
              if not section_dir.exists():
                  return []

              videos = []

              for folder in sorted(section_dir.iterdir(), key=lambda p: p.name.lower()):
                  if not folder.is_dir():
                      continue

                  all_files = list(folder.iterdir())

                  parts = sorted(
                      [
                          f for f in all_files
                          if f.is_file()
                          and f.suffix.lower() in VIDEO_EXTS
                          and "_part" in f.stem
                      ],
                      key=part_sort_key
                  )

                  full_video = next(
                      (
                          f for f in all_files
                          if f.is_file()
                          and f.suffix.lower() in VIDEO_EXTS
                          and "_part" not in f.stem
                      ),
                      None
                  )

                  thumbnail = next(
                      (
                          f for f in all_files
                          if f.is_file()
                          and f.suffix.lower() in IMAGE_EXTS
                      ),
                      None
                  )

                  videos.append({
                      "id": folder.name,
                      "title": folder.name,
                      "thumbnail": str(thumbnail).replace("\\", "/") if thumbnail else None,
                      "full": str(full_video).replace("\\", "/") if full_video else None,
                      "parts": [str(p).replace("\\", "/") for p in parts]
                  })

              return videos

          manifest = {
              "sections": {
                  "long": scan_section("long_videos"),
                  "short": scan_section("short_videos"),
              }
          }

          Path("assets").mkdir(exist_ok=True)
          with open("assets/library.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PYTHON

      - name: Commit and push all changes
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add downloads assets/library.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update media library"
          git push
