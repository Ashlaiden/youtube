name: ci

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TARGET_MB: "19"

    steps:

      # ============================================
      # Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # Install dependencies
      # ============================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            python3 \
            python3-pip

          python3 -m pip install --upgrade pip
          python3 -m pip install -U yt-dlp

      # ============================================
      # Create cookies file
      # ============================================
      - name: Create cookies file
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s\n' "${{ secrets.YT_COOKIES }}" > cookies.txt
            echo "Cookies loaded"
          else
            echo "No cookies provided"
          fi

      # ============================================
      # Split playlist
      # ============================================
      - name: Split playlist sections
        run: |
          set -euo pipefail

          if [ ! -f playlist.txt ]; then
            echo "playlist.txt not found"
            exit 1
          fi

          : > long_temp.txt
          : > short_temp.txt

          awk '
            BEGIN { mode = "" }

            /^#long/ {
              mode = "long"
              next
            }

            /^#short/ {
              mode = "short"
              next
            }

            /^#/ { next }
            NF == 0 { next }

            {
              if (mode == "long")
                print >> "long_temp.txt"

              if (mode == "short")
                print >> "short_temp.txt"
            }
          ' playlist.txt

          echo "Long URLs: $(wc -l < long_temp.txt || true)"
          echo "Short URLs: $(wc -l < short_temp.txt || true)"

      # ============================================
      # Download videos
      # ============================================
      - name: Download videos
        run: |
          set -euo pipefail

          mkdir -p downloads/long_videos
          mkdir -p downloads/short_videos

          download_group() {

            local batch_file="$1"
            local output_dir="$2"

            [ -s "$batch_file" ] || return 0

            mkdir -p "$output_dir"

            local args=(
              --batch-file "$batch_file"

              --ignore-errors
              --continue
              --no-overwrites
              --no-playlist

              --write-info-json
              --write-thumbnail
              --convert-thumbnails jpg

              --restrict-filenames

              --merge-output-format mp4

              --format "bestvideo+bestaudio/best"

              --output "${output_dir}/%(title)s_%(id)s/%(title)s_%(id)s.%(ext)s"
            )

            echo "Trying without cookies..."

            if yt-dlp "${args[@]}"; then
              return 0
            fi

            if [ -s cookies.txt ]; then

              echo "Retrying with cookies..."

              yt-dlp \
                --cookies cookies.txt \
                "${args[@]}"

              return 0
            fi

            echo "Download failed"
            return 1
          }

          download_group long_temp.txt downloads/long_videos
          download_group short_temp.txt downloads/short_videos

      # ============================================
      # Split videos
      # ============================================
      - name: Split videos into chunks
        run: |
          set -euo pipefail

          TARGET_BYTES=$((TARGET_MB * 1024 * 1024))

          split_video() {

            local input_file="$1"

            [ -f "$input_file" ] || return 0

            local dir
            local base
            local name
            local ext
            local size_bytes
            local duration
            local bitrate
            local segment_time

            dir="$(dirname "$input_file")"

            base="$(basename "$input_file")"

            name="${base%.*}"

            ext="${base##*.}"

            size_bytes="$(stat -c%s "$input_file")"

            if [ "$size_bytes" -le "$TARGET_BYTES" ]; then
              echo "No split needed: $input_file"
              return 0
            fi

            echo "Splitting: $input_file"

            duration="$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$input_file" | awk '{print int($1+0.5)}')"

            [ -z "$duration" ] && duration=60

            bitrate=$(( (size_bytes * 8) / duration ))

            segment_time=$(( (TARGET_BYTES * 8) / bitrate ))

            if [ "$segment_time" -lt 5 ]; then
              segment_time=5
            fi

            echo "Calculated segment time: ${segment_time}s"

            rm -f "${dir}/${name}_part"* 2>/dev/null || true

            ffmpeg \
              -hide_banner \
              -loglevel error \
              -y \
              -i "$input_file" \
              -map 0 \
              -c copy \
              -f segment \
              -segment_time "$segment_time" \
              -reset_timestamps 1 \
              "${dir}/${name}_part%03d.${ext}"

            if ls "${dir}/${name}_part"*".${ext}" >/dev/null 2>&1; then
              echo "Split successful"

              rm -f "$input_file"
            else
              echo "Split failed"
              exit 1
            fi
          }

          while IFS= read -r -d '' video; do

            case "$video" in
              *_part*.mp4|*_part*.mkv|*_part*.webm)
                continue
              ;;
            esac

            split_video "$video"

          done < <(
            find downloads \
              -type f \
              \( \
                -iname "*.mp4" \
                -o -iname "*.mkv" \
                -o -iname "*.webm" \
                -o -iname "*.mov" \
                -o -iname "*.m4v" \
              \) \
              -print0
          )

      # ============================================
      # Generate thumbnails fallback
      # ============================================
      - name: Generate fallback thumbnails
        run: |
          set -euo pipefail

          create_thumbnail() {

            local folder="$1"

            local existing_thumb
            existing_thumb="$(find "$folder" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | head -n 1 || true)"

            if [ -n "$existing_thumb" ]; then
              return 0
            fi

            local video
            video="$(find "$folder" -maxdepth 1 -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) | head -n 1 || true)"

            if [ -z "$video" ]; then
              return 0
            fi

            ffmpeg \
              -hide_banner \
              -loglevel error \
              -y \
              -ss 00:00:01 \
              -i "$video" \
              -frames:v 1 \
              "$folder/thumbnail.jpg" || true
          }

          find downloads/long_videos downloads/short_videos \
            -mindepth 1 \
            -maxdepth 1 \
            -type d | while read -r dir; do

            create_thumbnail "$dir"

          done

      # ============================================
      # Build library.json
      # ============================================
      - name: Build library manifest
        run: |
          python3 << 'PYTHON'
          import json
          import re
          from pathlib import Path

          VIDEO_EXTS = {".mp4", ".mkv", ".webm", ".mov", ".m4v"}
          IMAGE_EXTS = {".jpg", ".jpeg", ".png", ".webp"}

          ROOT = Path("downloads")

          def part_sort_key(path):
              m = re.search(r"_part(\d+)", path.stem)
              if m:
                  return int(m.group(1))
              return 999999

          def scan_section(section_name):

              section_dir = ROOT / section_name

              if not section_dir.exists():
                  return []

              videos = []

              for folder in sorted(section_dir.iterdir()):

                  if not folder.is_dir():
                      continue

                  all_files = list(folder.iterdir())

                  parts = sorted(
                      [
                          f for f in all_files
                          if f.is_file()
                          and f.suffix.lower() in VIDEO_EXTS
                          and "_part" in f.stem
                      ],
                      key=part_sort_key
                  )

                  full_video = next(
                      (
                          f for f in all_files
                          if f.is_file()
                          and f.suffix.lower() in VIDEO_EXTS
                          and "_part" not in f.stem
                      ),
                      None
                  )

                  thumbnail = next(
                      (
                          f for f in all_files
                          if f.is_file()
                          and f.suffix.lower() in IMAGE_EXTS
                      ),
                      None
                  )

                  meta = {
                      "title": folder.name
                  }

                  videos.append({
                      "id": folder.name,
                      "title": meta["title"],
                      "thumbnail":
                          str(thumbnail).replace("\\", "/")
                          if thumbnail else None,

                      "full":
                          str(full_video).replace("\\", "/")
                          if full_video else None,

                      "parts": [
                          str(p).replace("\\", "/")
                          for p in parts
                      ]
                  })

              return videos

          manifest = {
              "sections": {
                  "long": scan_section("long_videos"),
                  "short": scan_section("short_videos")
              }
          }

          Path("assets").mkdir(exist_ok=True)

          with open("assets/library.json", "w", encoding="utf-8") as f:
              json.dump(
                  manifest,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PYTHON

      # ============================================
      # Commit
      # ============================================
      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add downloads assets/library.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update media library"

          git push
