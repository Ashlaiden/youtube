name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        
      - name: نصب yt-dlp و ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg
          pip3 install yt-dlp
          
      - name: ساخت فایل کوکی از Secret
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ فایل کوکی خالی است!"
            exit 1
          fi
          
      - name: دانلود ویدیو با yt-dlp
        run: |
          git config --local user.email "your-email@example.com"   # تغییر دهید
          git config --local user.name "your-username"             # تغییر دهید
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          
          yt-dlp --cookies cookies.txt --config-location config.txt
          
      - name: تقسیم فایل‌های بزرگ (بزرگتر از 1.9 گیگابایت) با ffmpeg
        run: |
          # تابع تقسیم ویدیو بر اساس حجم
          split_video_by_size() {
            local input_file="$1"
            local max_size_mb=1900
            local file_size_mb=$(($(stat -c%s "$input_file") / 1048576))
            
            if [ $file_size_mb -le $max_size_mb ]; then
              echo "✅ $input_file (${file_size_mb}MB) نیاز به تقسیم ندارد."
              return 0
            fi
            
            echo "⚠️  $input_file (${file_size_mb}MB) بزرگتر از ${max_size_mb}MB است. در حال تقسیم..."
            
            local dir_name=$(dirname "$input_file")
            local base_name=$(basename "$input_file")
            local name_without_ext="${base_name%.*}"
            local ext="${base_name##*.}"
            
            # دریافت مدت زمان و بیت‌ریت برای محاسبه زمان هر قطعه
            local duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input_file")
            local bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$input_file")
            
            if [ -z "$bitrate" ] || [ "$bitrate" -eq 0 ]; then
              local avg_bitrate=$(( ($(stat -c%s "$input_file") * 8) / ${duration%.*} ))
            else
              local avg_bitrate=$bitrate
            fi
            
            local max_size_bytes=$((max_size_mb * 1048576))
            local chunk_duration=$(echo "scale=0; ($max_size_bytes * 8) / $avg_bitrate" | bc)
            [ "$chunk_duration" -lt 30 ] && chunk_duration=30
            
            echo "محاسبه: هر قطعه حدود $chunk_duration ثانیه"
            
            ffmpeg -i "$input_file" -c copy -map 0 -segment_time $chunk_duration -f segment -reset_timestamps 1 \
              "${dir_name}/${name_without_ext}_part%03d.${ext}"
            
            if [ $? -eq 0 ]; then
              echo "✅ تقسیم موفق بود. حذف فایل اصلی..."
              rm "$input_file"
            else
              echo "❌ خطا در تقسیم $input_file"
            fi
          }
          
          export -f split_video_by_size
          
          # اجرا روی همه فایل‌های ویدیویی در پوشه downloads
          find downloads -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -print0 | while IFS= read -r -d '' file; do
            split_video_by_size "$file"
          done
          
      - name: Commit و Push نهایی
        run: |
          git config --local user.email "your-email@example.com"
          git config --local user.name "your-username"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          git add downloads
          git commit -m "دانلود ویدیوها و تقسیم فایل‌های بزرگ (با کوکی)" || echo "تغییری برای commit وجود ندارد"
          rm -f cookies.txt
          git push
