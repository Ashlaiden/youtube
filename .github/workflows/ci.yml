name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install ffmpeg, yt-dlp, bc
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc
          pip3 install --upgrade pip
          pip3 install "yt-dlp[default]"

      - name: Create cookies file from Secret
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ فایل کوکی خالی است!"
            exit 1
          fi

      - name: Split playlist into long and short temporary files
        run: |
          if [ ! -f playlist.txt ]; then
            echo "⚠️ فایل playlist.txt یافت نشد. لطفاً آن را در ریشه مخزن ایجاد کنید."
            exit 1
          fi
          rm -f long_temp.txt short_temp.txt
          awk '
            /^#long/  { mode = "long"; next }
            /^#short/ { mode = "short"; next }
            mode == "long" && NF > 0 { print >> "long_temp.txt" }
            mode == "short" && NF > 0 { print >> "short_temp.txt" }
          ' playlist.txt
          echo "✅ لینک‌های بلند استخراج شده: $(wc -l < long_temp.txt) عدد"
          echo "✅ لینک‌های کوتاه استخراج شده: $(wc -l < short_temp.txt) عدد"

      # ============================================
      # دانلود ویدیوهای بلند + تامبنیل
      # ============================================
      - name: Download long videos
        run: |
          if [ -s long_temp.txt ]; then
            mkdir -p downloads/long_videos
            yt-dlp --cookies cookies.txt \
              --batch-file long_temp.txt \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "downloads/long_videos/%(title)s/%(title)s_%(id)s.%(ext)s" \
              --output "thumbnail:downloads/long_videos/%(title)s/%(title)s_%(id)s.%(ext)s" \
              --continue \
              --restrict-filenames \
              --merge-output-format mp4
          else
            echo "⏩ هیچ لینک بلندی برای دانلود وجود ندارد."
          fi

      # ============================================
      # تقسیم ویدیوهای بلند به قطعات (حداکثر 19 مگابایت)
      # ============================================
      - name: Split long videos into chunks
        env:
          MAX_CHUNK_MB: 19
        run: |
          set -e
          # پیدا کردن فایل‌های ویدیویی که قبلاً split نشده‌اند (نامشان _part ندارد)
          mapfile -t video_files < <(find downloads/long_videos -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -not -name "*_part*" -print0 | xargs -0 -n1 echo)
          for input_file in "${video_files[@]}"; do
            if [ ! -f "$input_file" ]; then
              echo "⚠️ فایل وجود ندارد: $input_file"
              continue
            fi
            size_mb=$(($(stat -c%s "$input_file") / 1048576))
            if [ $size_mb -le $MAX_CHUNK_MB ]; then
              echo "✅ $input_file (${size_mb}MB) نیازی به تقسیم ندارد."
              continue
            fi
            echo "⚠️ تقسیم $input_file (${size_mb}MB) به قطعات حداکثر ${MAX_CHUNK_MB}MB"
            dir=$(dirname "$input_file")
            base=$(basename "$input_file")
            name="${base%.*}"
            ext="${base##*.}"
            # حذف قطعات قبلی در صورت وجود
            rm -f "${dir}/${name}_part"* 2>/dev/null || true
            # اجرای ffmpeg با پوشش کامل خطا
            ffmpeg -i "$input_file" -c copy -map 0 -f segment -segment_time 30 -reset_timestamps 1 \
              -fs $(($MAX_CHUNK_MB * 1024 * 1024)) \
              "${dir}/${name}_part%03d.${ext}" -y 2>&1 | tee /tmp/ffmpeg_log.txt
            # بررسی موفقیت: آیا حداقل یک قطعه ساخته شده؟
            if [ -f "${dir}/${name}_part000.${ext}" ]; then
              echo "✅ تقسیم موفق. حذف فایل اصلی..."
              rm -f "$input_file"
            else
              echo "❌ خطا: هیچ قطعه‌ای ساخته نشد. خروجی ffmpeg:"
              cat /tmp/ffmpeg_log.txt
              exit 1
            fi
          done

      # ============================================
      # دانلود ویدیوهای کوتاه + تامبنیل
      # ============================================
      - name: Download short videos
        run: |
          if [ -s short_temp.txt ]; then
            mkdir -p downloads/short_videos
            yt-dlp --cookies cookies.txt \
              --batch-file short_temp.txt \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "downloads/short_videos/%(title)s_%(id)s.%(ext)s" \
              --output "thumbnail:downloads/short_videos/%(title)s_%(id)s.%(ext)s" \
              --continue \
              --restrict-filenames \
              --merge-output-format mp4
          else
            echo "⏩ هیچ لینک کوتاهی برای دانلود وجود ندارد."
          fi

      # ============================================
      # تقسیم ویدیوهای کوتاه به قطعات (در صورت نیاز)
      # ============================================
      - name: Split short videos into chunks
        env:
          MAX_CHUNK_MB: 19
        run: |
          set -e
          mapfile -t video_files < <(find downloads/short_videos -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -not -name "*_part*" -print0 | xargs -0 -n1 echo)
          for input_file in "${video_files[@]}"; do
            if [ ! -f "$input_file" ]; then
              echo "⚠️ فایل وجود ندارد: $input_file"
              continue
            fi
            size_mb=$(($(stat -c%s "$input_file") / 1048576))
            if [ $size_mb -le $MAX_CHUNK_MB ]; then
              echo "✅ $input_file (${size_mb}MB) نیاز به تقسیم ندارد."
              continue
            fi
            echo "⚠️ تقسیم $input_file (${size_mb}MB) به قطعات حداکثر ${MAX_CHUNK_MB}MB"
            dir=$(dirname "$input_file")
            base=$(basename "$input_file")
            name="${base%.*}"
            ext="${base##*.}"
            rm -f "${dir}/${name}_part"* 2>/dev/null || true
            ffmpeg -i "$input_file" -c copy -map 0 -f segment -segment_time 30 -reset_timestamps 1 \
              -fs $(($MAX_CHUNK_MB * 1024 * 1024)) \
              "${dir}/${name}_part%03d.${ext}" -y 2>&1 | tee /tmp/ffmpeg_short_log.txt
            if [ -f "${dir}/${name}_part000.${ext}" ]; then
              echo "✅ تقسیم موفق. حذف فایل اصلی..."
              rm -f "$input_file"
            else
              echo "❌ خطا: هیچ قطعه‌ای ساخته نشد. خروجی ffmpeg:"
              cat /tmp/ffmpeg_short_log.txt
              exit 1
            fi
          done

      - name: Commit and push all changes
        run: |
          git config --local user.email "your-email@example.com"
          git config --local user.name "your-username"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          git add downloads
          git commit -m "دانلود خودکار ویدیوها، تامبنیل‌ها و تقسیم به قطعات 19MB" || echo "No changes to commit"
          rm -f cookies.txt long_temp.txt short_temp.txt
          git push
