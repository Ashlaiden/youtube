name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install ffmpeg, yt-dlp, bc
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc
          pip3 install --upgrade pip
          pip3 install "yt-dlp[default]"

      - name: Create cookies file from Secret
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ فایل کوکی خالی است!"
            exit 1
          fi

      # ============================================
      # دسته اول: ویدیوهای بلند (هر ویدیو در یک پوشه مجزا)
      # ============================================
      - name: Download long videos (each in its own folder)
        run: |
          mkdir -p downloads/long_videos
          # الگوی خروجی: downloads/long_videos/عنوان ویدیو/عنوان ویدیو_آیدی
          yt-dlp --cookies cookies.txt \
            --batch-file long_videos.txt \
            --output "downloads/long_videos/%(title)s/%(title)s_%(id)s.%(ext)s" \
            --continue \
            --restrict-filenames \
            --merge-output-format mp4

      - name: Split long video files (max 95MB per chunk)
        run: |
          split_video_by_size() {
            local input_file="$1"
            [ ! -f "$input_file" ] && return 0
            local size_mb=$(($(stat -c%s "$input_file") / 1048576))
            [ $size_mb -le 95 ] && echo "✅ $input_file (${size_mb}MB) نیازی به تقسیم ندارد." && return 0
            
            echo "⚠️ تقسیم $input_file (${size_mb}MB)"
            local dir=$(dirname "$input_file")
            local base=$(basename "$input_file")
            local name="${base%.*}"
            local ext="${base##*.}"
            
            local duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input_file")
            local bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$input_file")
            if [ -z "$bitrate" ] || [ "$bitrate" -eq 0 ]; then
              bitrate=$(( ($(stat -c%s "$input_file") * 8) / ${duration%.*} ))
            fi
            local chunk_duration=$(echo "scale=0; (95 * 1048576 * 8) / $bitrate" | bc)
            [ "$chunk_duration" -lt 30 ] && chunk_duration=30
            
            ffmpeg -i "$input_file" -c copy -map 0 -segment_time $chunk_duration -f segment -reset_timestamps 1 \
              "${dir}/${name}_part%03d.${ext}" < /dev/null && rm -f "$input_file"
          }
          export -f split_video_by_size
          find downloads/long_videos -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -print0 | while IFS= read -r -d '' file; do
            split_video_by_size "$file"
          done

      # ============================================
      # دسته دوم: ویدیوهای کوتاه (همه در یک پوشه مشترک)
      # ============================================
      - name: Download short videos (all in one folder)
        run: |
          mkdir -p downloads/short_videos
          # همه فایل‌های کوتاه مستقیماً در پوشه short_videos ذخیره می‌شوند
          yt-dlp --cookies cookies.txt \
            --batch-file short_videos.txt \
            --output "downloads/short_videos/%(title)s_%(id)s.%(ext)s" \
            --continue \
            --restrict-filenames \
            --merge-output-format mp4

      - name: Split short videos if needed (same 95MB limit)
        run: |
          split_video_by_size() {
            local input_file="$1"
            [ ! -f "$input_file" ] && return 0
            local size_mb=$(($(stat -c%s "$input_file") / 1048576))
            [ $size_mb -le 95 ] && echo "✅ $input_file (${size_mb}MB) نیازی به تقسیم ندارد." && return 0
            
            echo "⚠️ تقسیم $input_file (${size_mb}MB)"
            local dir=$(dirname "$input_file")
            local base=$(basename "$input_file")
            local name="${base%.*}"
            local ext="${base##*.}"
            
            local duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input_file")
            local bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$input_file")
            if [ -z "$bitrate" ] || [ "$bitrate" -eq 0 ]; then
              bitrate=$(( ($(stat -c%s "$input_file") * 8) / ${duration%.*} ))
            fi
            local chunk_duration=$(echo "scale=0; (95 * 1048576 * 8) / $bitrate" | bc)
            [ "$chunk_duration" -lt 30 ] && chunk_duration=30
            
            ffmpeg -i "$input_file" -c copy -map 0 -segment_time $chunk_duration -f segment -reset_timestamps 1 \
              "${dir}/${name}_part%03d.${ext}" < /dev/null && rm -f "$input_file"
          }
          export -f split_video_by_size
          find downloads/short_videos -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -print0 | while IFS= read -r -d '' file; do
            split_video_by_size "$file"
          done

      - name: Commit and push all changes
        run: |
          git config --local user.email "your-email@example.com"
          git config --local user.name "your-username"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          git add downloads
          git commit -m "دانلود خودکار ویدیوهای بلند و کوتاه (دسته‌بندی شده)" || echo "No changes to commit"
          rm -f cookies.txt
          git push
