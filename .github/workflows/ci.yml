name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install ffmpeg, yt-dlp, bc
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc
          pip3 install --upgrade pip
          pip3 install "yt-dlp[default]"

      - name: Create cookies file from Secret
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ فایل کوکی خالی است!"
            exit 1
          fi

      - name: Split playlist into long and short temporary files
        run: |
          # اگر فایل playlist.txt وجود نداشته باشد، خروجی می‌شویم
          if [ ! -f playlist.txt ]; then
            echo "⚠️ فایل playlist.txt یافت نشد. لطفاً آن را در ریشه مخزن ایجاد کنید."
            exit 1
          fi
          
          # پاک کردن فایل‌های موقت قبلی (اگر وجود داشته باشند)
          rm -f long_temp.txt short_temp.txt
          
          # پردازش فایل: هر خط که با #long شروع شود، حالت long فعال می‌شود
          # با #short حالت short فعال می‌شود. بقیه خطوط (غیرخالی) در حالت جاری ذخیره می‌شوند.
          awk '
            /^#long/  { mode = "long"; next }
            /^#short/ { mode = "short"; next }
            mode == "long" && NF > 0 { print >> "long_temp.txt" }
            mode == "short" && NF > 0 { print >> "short_temp.txt" }
          ' playlist.txt
          
          echo "✅ لینک‌های بلند استخراج شده: $(wc -l < long_temp.txt) عدد"
          echo "✅ لینک‌های کوتاه استخراج شده: $(wc -l < short_temp.txt) عدد"

      # ============================================
      # دسته اول: ویدیوهای بلند (هر ویدیو در یک پوشه مجزا)
      # ============================================
      - name: Download long videos (each in its own folder)
        run: |
          if [ -s long_temp.txt ]; then
            mkdir -p downloads/long_videos
            yt-dlp --cookies cookies.txt \
              --batch-file long_temp.txt \
              --output "downloads/long_videos/%(title)s/%(title)s_%(id)s.%(ext)s" \
              --continue \
              --restrict-filenames \
              --merge-output-format mp4
          else
            echo "⏩ هیچ لینک بلندی برای دانلود وجود ندارد."
          fi

      - name: Split long video files (max 95MB per chunk)
        run: |
          split_video_by_size() {
            local input_file="$1"
            [ ! -f "$input_file" ] && return 0
            local size_mb=$(($(stat -c%s "$input_file") / 1048576))
            [ $size_mb -le 95 ] && echo "✅ $input_file (${size_mb}MB) نیازی به تقسیم ندارد." && return 0
            
            echo "⚠️ تقسیم $input_file (${size_mb}MB)"
            local dir=$(dirname "$input_file")
            local base=$(basename "$input_file")
            local name="${base%.*}"
            local ext="${base##*.}"
            
            local duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input_file")
            local bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$input_file")
            if [ -z "$bitrate" ] || [ "$bitrate" -eq 0 ]; then
              bitrate=$(( ($(stat -c%s "$input_file") * 8) / ${duration%.*} ))
            fi
            local chunk_duration=$(echo "scale=0; (95 * 1048576 * 8) / $bitrate" | bc)
            [ "$chunk_duration" -lt 30 ] && chunk_duration=30
            
            ffmpeg -i "$input_file" -c copy -map 0 -segment_time $chunk_duration -f segment -reset_timestamps 1 \
              "${dir}/${name}_part%03d.${ext}" < /dev/null && rm -f "$input_file"
          }
          export -f split_video_by_size
          if [ -d downloads/long_videos ]; then
            find downloads/long_videos -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -print0 | while IFS= read -r -d '' file; do
              split_video_by_size "$file"
            done
          fi

      # ============================================
      # دسته دوم: ویدیوهای کوتاه (همه در یک پوشه مشترک)
      # ============================================
      - name: Download short videos (all in one folder)
        run: |
          if [ -s short_temp.txt ]; then
            mkdir -p downloads/short_videos
            yt-dlp --cookies cookies.txt \
              --batch-file short_temp.txt \
              --output "downloads/short_videos/%(title)s_%(id)s.%(ext)s" \
              --continue \
              --restrict-filenames \
              --merge-output-format mp4
          else
            echo "⏩ هیچ لینک کوتاهی برای دانلود وجود ندارد."
          fi

      - name: Split long video files (max 90MB per chunk)
        run: |
          split_video_by_size() {
            local input_file="$1"
            [ ! -f "$input_file" ] && return 0
            local size_mb=$(($(stat -c%s "$input_file") / 1048576))
            local max_size_mb=90
            [ $size_mb -le $max_size_mb ] && echo "✅ $input_file (${size_mb}MB) نیازی به تقسیم ندارد." && return 0
            
            echo "⚠️ تقسیم $input_file (${size_mb}MB)"
            local dir=$(dirname "$input_file")
            local base=$(basename "$input_file")
            local name="${base%.*}"
            local ext="${base##*.}"
            
            # استفاده از گزینه -fs در ffmpeg برای کنترل دقیق حجم هر قطعه (حداکثر 90 مگابایت)
            # این روش بسیار دقیق‌تر از محاسبه زمان است
            ffmpeg -i "$input_file" -c copy -map 0 -f segment -segment_time 30 -reset_timestamps 1 \
              -fs $(($max_size_mb * 1024 * 1024)) \
              "${dir}/${name}_part%03d.${ext}" < /dev/null
            
            if [ $? -eq 0 ]; then
              echo "✅ تقسیم موفق بود. حذف فایل اصلی..."
              rm -f "$input_file"
            else
              echo "❌ خطا در تقسیم $input_file"
            fi
          }
          export -f split_video_by_size
          if [ -d downloads/long_videos ]; then
            find downloads/long_videos -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" \) -print0 | while IFS= read -r -d '' file; do
              split_video_by_size "$file"
            done
          fi

      - name: Commit and push all changes
        run: |
          git config --local user.email "your-email@example.com"
          git config --local user.name "your-username"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          git add downloads
          git commit -m "دانلود خودکار ویدیوهای بلند و کوتاه (دسته‌بندی از یک فایل)" || echo "No changes to commit"
          rm -f cookies.txt long_temp.txt short_temp.txt
          git push
