- name: Split large video files (max 95MB per chunk) BEFORE commit
  run: |
    # پاکسازی فایل‌های ناقص یا خراب (اختیاری)
    find downloads -type f -name "*Data Fetching*" -delete 2>/dev/null || true
    find downloads -type f -size 0 -delete 2>/dev/null || true
    
    # تابع تقسیم فایل‌های ویدیویی بزرگتر از 95MB
    split_video_by_size() {
      local input_file="$1"
      if [ ! -f "$input_file" ]; then
        echo "⚠️ فایل وجود ندارد: $input_file"
        return 0
      fi
      
      local file_size_bytes=$(stat -c%s "$input_file" 2>/dev/null)
      if [ -z "$file_size_bytes" ] || [ "$file_size_bytes" -eq 0 ]; then
        echo "⚠️ حجم فایل نامعتبر: $input_file"
        return 0
      fi
      
      local file_size_mb=$((file_size_bytes / 1048576))
      local max_size_mb=95
      
      if [ $file_size_mb -le $max_size_mb ]; then
        echo "✅ $input_file (${file_size_mb}MB) نیازی به تقسیم ندارد."
        return 0
      fi
      
      echo "⚠️  $input_file (${file_size_mb}MB) بزرگتر از ${max_size_mb}MB است. در حال تقسیم..."
      
      local dir_name=$(dirname "$input_file")
      local base_name=$(basename "$input_file")
      local name_without_ext="${base_name%.*}"
      local ext="${base_name##*.}"
      
      local duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input_file" 2>/dev/null)
      if [ -z "$duration" ]; then
        echo "❌ مدت زمان نامشخص: $input_file"
        return 1
      fi
      
      local bitrate=$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$input_file" 2>/dev/null)
      if [ -z "$bitrate" ] || [ "$bitrate" -eq 0 ]; then
        local avg_bitrate=$(echo "scale=0; ($file_size_bytes * 8) / $duration" | bc 2>/dev/null)
        if [ -z "$avg_bitrate" ] || [ "$avg_bitrate" -eq 0 ]; then
          echo "❌ نمی‌توان بیت‌ریت را محاسبه کرد: $input_file"
          return 1
        fi
      else
        local avg_bitrate=$bitrate
      fi
      
      local max_size_bytes=$((max_size_mb * 1048576))
      local chunk_duration=$(echo "scale=0; ($max_size_bytes * 8) / $avg_bitrate" | bc 2>/dev/null)
      if [ -z "$chunk_duration" ] || [ "$chunk_duration" -lt 30 ]; then
        chunk_duration=30
      fi
      
      echo "محاسبه: هر قطعه حدود $chunk_duration ثانیه"
      
      ffmpeg -i "$input_file" -c copy -map 0 -segment_time $chunk_duration -f segment -reset_timestamps 1 \
        "${dir_name}/${name_without_ext}_part%03d.${ext}" < /dev/null
      
      if [ $? -eq 0 ]; then
        echo "✅ تقسیم موفق بود. حذف فایل اصلی..."
        rm -f "$input_file"
      else
        echo "❌ خطا در تقسیم $input_file"
        return 1
      fi
    }
    
    export -f split_video_by_size
    
    # پردازش همه فایل‌های ویدیویی (با حلقه safe)
    find downloads -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.webm" -o -iname "*.avi" \) -print0 | while IFS= read -r -d '' file; do
      split_video_by_size "$file" || true
    done
