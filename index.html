<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>پخش‌کننده ویدیو | کتابخانه من</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0c12 0%, #0f1117 100%);
            color: #f0f3fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(18, 22, 32, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #a0a8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .domain-switch {
            display: flex;
            gap: 0.5rem;
            background: #1e2436;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            align-items: center;
        }
        .domain-switch button {
            background: transparent;
            border: none;
            color: #9aa2bf;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .domain-switch button.active {
            background: #7c8aff;
            color: #0b0c12;
        }
        .current-path {
            background: #1e2436;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-family: monospace;
            color: #b9c3ff;
            border: 1px solid #2a3348;
        }

        .player-section {
            background: #000000;
            margin: 1.5rem 2rem;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .player-section.hidden {
            display: none;
        }
        .plyr {
            border-radius: 24px;
        }
        .player-info {
            padding: 1rem 1.5rem;
            background: rgba(20, 25, 38, 0.9);
            backdrop-filter: blur(8px);
            border-top: 1px solid #2a3448;
        }
        .video-title {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin: 0 2rem 1rem 2rem;
            border-bottom: 1px solid #232838;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #9aa2bf;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.8rem;
            cursor: pointer;
            border-radius: 28px 28px 0 0;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #1e253a;
            color: white;
            box-shadow: 0 -2px 0 #7c8aff;
        }

        .content-container {
            margin: 1rem 2rem 2rem 2rem;
        }
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .video-card {
            background: #141a24;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s;
            cursor: pointer;
            border: 1px solid #232838;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -10px black;
            border-color: #3e4a6b;
        }
        .thumbnail {
            position: relative;
            background: #0b0f17;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumbnail-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1f2e, #0f1320);
            color: #7c8aff;
            font-size: 3rem;
        }
        .thumbnail-placeholder span {
            font-size: 0.8rem;
            margin-top: 8px;
            color: #9aa2bf;
        }
        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .card-info {
            padding: 1rem;
        }
        .card-title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            font-size: 0.75rem;
            color: #8f9bb3;
            margin-top: 0.5rem;
            display: flex;
            justify-content: space-between;
        }
        .loading-state, .empty-state {
            text-align: center;
            padding: 3rem;
            background: #10131e;
            border-radius: 32px;
            color: #a5b1d3;
        }
        .spinner {
            border: 3px solid #2a2f42;
            border-top: 3px solid #7c8aff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 700px) {
            .header, .tabs, .content-container {
                margin-left: 1rem;
                margin-right: 1rem;
            }
            .library-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M10 8.64L15.27 12 10 15.36V8.64zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        <span>Media Vault</span>
    </div>
    <div class="domain-switch" id="domainSwitch">
        <button data-domain="jsdelivr" class="active">jsDelivr</button>
        <button data-domain="raw">GitHub Raw</button>
    </div>
    <div class="current-path" id="currentPathDisplay">📁 ریشه</div>
</div>

<div class="player-section hidden" id="playerSection">
    <video id="smartPlayer" class="plyr" playsinline crossorigin></video>
    <div class="player-info">
        <div class="video-title" id="playerTitle">—</div>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="videos">🎬 ویدیو‌های بلند</button>
    <button class="tab-btn" data-tab="shorts">📱 Shorts</button>
</div>

<div class="content-container" id="contentContainer">
    <div class="loading-state"><div class="spinner"></div><div>در حال بارگذاری کتابخانه...</div></div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
    // ============== تنظیمات مخزن (تغییر دهید) ==============
    const REPO_OWNER = 'Ashlaiden';      // نام کاربری خود را وارد کنید
    const REPO_NAME = 'youtube';          // نام مخزن
    const BRANCH = 'main';

    const LONG_VIDEOS_PATH = 'downloads/long_videos';
    const SHORTS_PATH = 'downloads/short_videos';

    let currentDomain = 'jsdelivr'; // 'jsdelivr' یا 'raw'

    function getStreamableUrl(filePath) {
        if (currentDomain === 'jsdelivr') {
            return `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${BRANCH}/${filePath}`;
        } else {
            return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${filePath}`;
        }
    }

    async function fetchGitHubContents(path) {
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`GitHub API error ${response.status}: ${path}`);
        return await response.json();
    }

    function isVideoFile(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'mkv', 'mov', 'm4v'].includes(ext);
    }

    async function loadLongVideos() {
        try {
            const items = await fetchGitHubContents(LONG_VIDEOS_PATH);
            const folders = items.filter(i => i.type === 'dir');
            const videosData = [];
            for (const folder of folders) {
                const folderPath = `${LONG_VIDEOS_PATH}/${folder.name}`;
                const folderContents = await fetchGitHubContents(folderPath);
                const videoFiles = folderContents.filter(f => f.type === 'file' && isVideoFile(f.name));
                videoFiles.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
                const videoUrls = videoFiles.map(vf => getStreamableUrl(vf.path));
                if (videoUrls.length === 0) continue;
                let title = folder.name.replace(/_/g, ' ').replace(/part\d+/gi, '').trim();
                if (!title) title = folder.name;
                videosData.push({
                    id: folder.name,
                    title: title,
                    parts: videoUrls,
                    totalParts: videoUrls.length
                });
            }
            return videosData;
        } catch (err) {
            console.error("خطا در بارگذاری ویدیوهای بلند:", err);
            return [];
        }
    }

    async function loadShortVideos() {
        try {
            const items = await fetchGitHubContents(SHORTS_PATH);
            const videoFiles = items.filter(i => i.type === 'file' && isVideoFile(i.name));
            const groups = new Map();
            for (const file of videoFiles) {
                let base = file.name.replace(/_(part\d+)/i, '').replace(/\.\w+$/, '');
                if (!groups.has(base)) groups.set(base, []);
                groups.get(base).push({ name: file.name, path: file.path });
            }
            const shortsData = [];
            for (let [base, files] of groups.entries()) {
                files.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
                const urls = files.map(f => getStreamableUrl(f.path));
                shortsData.push({
                    id: base,
                    title: base.replace(/_/g, ' '),
                    parts: urls,
                    totalParts: urls.length
                });
            }
            return shortsData;
        } catch (err) {
            console.error("خطا در بارگذاری Shorts:", err);
            return [];
        }
    }

    function renderVideoGrid(items, type) {
        if (!items.length) {
            contentContainer.innerHTML = `<div class="empty-state">📭 هیچ ویدیویی در این بخش یافت نشد.</div>`;
            return;
        }
        const grid = document.createElement('div');
        grid.className = 'library-grid';
        for (const item of items) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.setAttribute('data-id', item.id);
            const thumbDiv = document.createElement('div');
            thumbDiv.className = 'thumbnail';
            const placeholder = document.createElement('div');
            placeholder.className = 'thumbnail-placeholder';
            const icon = document.createElement('div');
            icon.style.fontSize = '3rem';
            icon.innerText = type === 'long' ? '🎬' : '📱';
            const label = document.createElement('span');
            label.innerText = type === 'long' ? `${item.totalParts} بخش` : (item.totalParts > 1 ? `${item.totalParts} قطعه` : 'Short');
            placeholder.appendChild(icon);
            placeholder.appendChild(label);
            thumbDiv.appendChild(placeholder);
            if (item.totalParts > 1) {
                const badge = document.createElement('div');
                badge.className = 'duration-badge';
                badge.innerText = `${item.totalParts} قطعه`;
                thumbDiv.appendChild(badge);
            }
            const infoDiv = document.createElement('div');
            infoDiv.className = 'card-info';
            const titleSpan = document.createElement('div');
            titleSpan.className = 'card-title';
            titleSpan.innerText = item.title.length > 50 ? item.title.slice(0,47)+'...' : item.title;
            const metaSpan = document.createElement('div');
            metaSpan.className = 'card-meta';
            metaSpan.innerText = type === 'long' ? `📀 ${item.totalParts} قسمت` : `⏱️ ${item.totalParts} قطعه`;
            infoDiv.appendChild(titleSpan);
            infoDiv.appendChild(metaSpan);
            card.appendChild(thumbDiv);
            card.appendChild(infoDiv);
            card.addEventListener('click', () => playSelectedItem(item, type));
            grid.appendChild(card);
        }
        contentContainer.innerHTML = '';
        contentContainer.appendChild(grid);
    }

    let currentPlayer = null;
    let endedHandler = null;
    const playerVideo = document.getElementById('smartPlayer');
    const playerSection = document.getElementById('playerSection');
    const playerTitle = document.getElementById('playerTitle');

    function playSelectedItem(item, type) {
        if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
        if (currentPlayer) currentPlayer.destroy();
        playerVideo.pause();
        if (item.parts.length === 1) {
            playerVideo.src = item.parts[0];
            playerTitle.innerText = item.title;
            playerSection.classList.remove('hidden');
            playerVideo.load();
            playerVideo.play().catch(e=>console.warn(e));
            currentPlayer = new Plyr(playerVideo);
        } else {
            let currentPartIndex = 0;
            const playPart = (index) => {
                if (index >= item.parts.length) return;
                playerVideo.src = item.parts[index];
                playerTitle.innerText = `${item.title} (بخش ${index+1}/${item.parts.length})`;
                playerVideo.load();
                playerVideo.play().catch(e=>console.warn(e));
                if (currentPlayer) currentPlayer.destroy();
                currentPlayer = new Plyr(playerVideo);
                if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
                endedHandler = () => playPart(index + 1);
                playerVideo.addEventListener('ended', endedHandler);
            };
            playPart(0);
            playerSection.classList.remove('hidden');
        }
    }

    let currentTab = 'videos';
    async function renderCurrentTab() {
        contentContainer.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>در حال بارگذاری...</div></div>`;
        let items = [];
        if (currentTab === 'videos') {
            items = await loadLongVideos();
            renderVideoGrid(items, 'long');
        } else {
            items = await loadShortVideos();
            renderVideoGrid(items, 'short');
        }
        document.getElementById('currentPathDisplay').innerText = currentTab === 'videos' ? '📁 Videos / هر ویدیو یک پوشه' : '📁 Shorts / ویدیوهای کوتاه';
    }

    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.getAttribute('data-tab');
                renderCurrentTab();
                playerSection.classList.add('hidden');
                if (playerVideo.src) playerVideo.pause();
                if (currentPlayer) currentPlayer.destroy();
                if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
            });
        });
    }

    function initDomainSwitch() {
        const btns = document.querySelectorAll('#domainSwitch button');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDomain = btn.getAttribute('data-domain');
                renderCurrentTab();
                playerSection.classList.add('hidden');
                if (playerVideo.src) playerVideo.pause();
                if (currentPlayer) currentPlayer.destroy();
                if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
            });
        });
    }

    (async function init() {
        initTabs();
        initDomainSwitch();
        await renderCurrentTab();
        playerVideo.addEventListener('error', (e) => {
            console.error("خطا در پخش ویدیو. ممکن است دامنه انتخاب شده مسدود باشد.", e);
            alert("خطا در پخش. لطفاً دامنه دیگر را امتحان کنید.");
        });
    })();
</script>
</body>
</html>
