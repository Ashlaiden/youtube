<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>پخش‌کننده ویدیو | کتابخانه من</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0f0f0f; /* رنگ پس‌زمینه یوتیوب */
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* هدر شبیه یوتیوب */
        .header {
            background: #0f0f0f;
            border-bottom: 1px solid #272727;
            padding: 0.6rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #ffffff;
            text-decoration: none;
        }
        .logo svg {
            width: 28px;
            height: 28px;
            fill: #ff0000;
        }

        .nav-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .nav-btn {
            background: #272727;
            border: none;
            color: #f1f1f1;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover {
            background: #3f3f3f;
        }
        .nav-btn.home-btn {
            background: #ff0000;
            color: white;
        }
        .nav-btn.home-btn:hover {
            background: #cc0000;
        }

        .domain-switch {
            display: flex;
            gap: 0.3rem;
            background: #272727;
            padding: 0.2rem 0.5rem;
            border-radius: 40px;
        }
        .domain-switch button {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .domain-switch button.active {
            background: #3f3f3f;
            color: white;
        }

        .current-path {
            background: #272727;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-family: monospace;
            color: #ccc;
        }

        /* پلیر با ابعاد ثابت */
        .player-section {
            display: flex;
            justify-content: center;
            margin: 1rem auto;
            padding: 0 1rem;
            max-width: 100%;
        }
        .player-section.hidden {
            display: none;
        }
        .player-wrapper {
            width: 100%;
            max-width: 960px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .plyr {
            border-radius: 0;
            width: 100%;
            aspect-ratio: 16 / 9; /* نسبت 16:9 ثابت */
        }
        .player-info {
            padding: 0.8rem 1rem;
            background: #1e1e1e;
        }
        .video-title {
            font-size: 1rem;
            font-weight: 500;
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            gap: 0.2rem;
            margin: 1rem 1rem 0.5rem 1rem;
            border-bottom: 1px solid #333;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: white;
            border-bottom: 2px solid #ff0000;
        }

        /* گرید ویدیوها (شبیه یوتیوب) */
        .content-container {
            margin: 1rem 1.5rem 2rem 1.5rem;
        }
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
        }
        .thumbnail {
            position: relative;
            background: #0a0a0a;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumbnail-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            color: #888;
            font-size: 2rem;
        }
        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .card-info {
            padding: 0.7rem;
        }
        .card-title {
            font-weight: 500;
            font-size: 0.9rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 0.4rem;
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 3rem;
            color: #aaa;
        }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #ff0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 700px) {
            .header {
                padding: 0.5rem 1rem;
            }
            .domain-switch button {
                padding: 0.2rem 0.6rem;
            }
            .content-container {
                margin: 1rem;
            }
            .library-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M10 8.64L15.27 12 10 15.36V8.64zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        <span>Media Vault</span>
    </div>
    <div class="nav-buttons">
        <button class="nav-btn back-btn" id="backBtn">↩️ بازگشت</button>
        <button class="nav-btn home-btn" id="homeBtn">🏠 صفحه اصلی</button>
    </div>
    <div class="domain-switch" id="domainSwitch">
        <button data-domain="jsdelivr" class="active">jsDelivr</button>
        <button data-domain="raw">GitHub Raw</button>
    </div>
    <div class="current-path" id="currentPathDisplay">📁 کتابخانه</div>
</div>

<div class="player-section hidden" id="playerSection">
    <div class="player-wrapper">
        <video id="smartPlayer" class="plyr" playsinline crossorigin></video>
        <div class="player-info">
            <div class="video-title" id="playerTitle">—</div>
        </div>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="videos">🎬 ویدیو‌های بلند</button>
    <button class="tab-btn" data-tab="shorts">📱 Shorts</button>
</div>

<div class="content-container" id="contentContainer">
    <div class="loading-state"><div class="spinner"></div><div>در حال بارگذاری کتابخانه...</div></div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
    // ============== تنظیمات مخزن (تغییر دهید) ==============
    const REPO_OWNER = 'Ashlaiden';      // نام کاربری خود را وارد کنید
    const REPO_NAME = 'youtube';          // نام مخزن
    const BRANCH = 'main';

    const LONG_VIDEOS_PATH = 'downloads/long_videos';
    const SHORTS_PATH = 'downloads/short_videos';

    let currentDomain = 'jsdelivr'; // 'jsdelivr' یا 'raw'

    function getStreamableUrl(filePath) {
        if (currentDomain === 'jsdelivr') {
            return `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${BRANCH}/${filePath}`;
        } else {
            return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${filePath}`;
        }
    }

    async function fetchGitHubContents(path) {
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`GitHub API error ${response.status}: ${path}`);
        return await response.json();
    }

    function isVideoFile(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'mkv', 'mov', 'm4v'].includes(ext);
    }

    function isThumbnailFile(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ext === 'jpg' || ext === 'jpeg' || ext === 'png';
    }

    // بارگذاری ویدیوهای بلند + تامبنیل
    async function loadLongVideos() {
        try {
            const items = await fetchGitHubContents(LONG_VIDEOS_PATH);
            const folders = items.filter(i => i.type === 'dir');
            const videosData = [];
            for (const folder of folders) {
                const folderPath = `${LONG_VIDEOS_PATH}/${folder.name}`;
                const folderContents = await fetchGitHubContents(folderPath);
                const videoFiles = folderContents.filter(f => f.type === 'file' && isVideoFile(f.name));
                const thumbnailFile = folderContents.find(f => f.type === 'file' && isThumbnailFile(f.name));
                videoFiles.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
                const videoUrls = videoFiles.map(vf => getStreamableUrl(vf.path));
                const thumbnailUrl = thumbnailFile ? getStreamableUrl(thumbnailFile.path) : null;
                if (videoUrls.length === 0) continue;
                let title = folder.name.replace(/_/g, ' ').replace(/part\d+/gi, '').trim();
                if (!title) title = folder.name;
                videosData.push({
                    id: folder.name,
                    title: title,
                    parts: videoUrls,
                    totalParts: videoUrls.length,
                    thumbnail: thumbnailUrl
                });
            }
            return videosData;
        } catch (err) {
            console.error("خطا در بارگذاری ویدیوهای بلند:", err);
            return [];
        }
    }

    // بارگذاری ویدیوهای کوتاه + تامبنیل
    async function loadShortVideos() {
        try {
            const items = await fetchGitHubContents(SHORTS_PATH);
            const videoFiles = items.filter(i => i.type === 'file' && isVideoFile(i.name));
            const thumbnailFiles = items.filter(i => i.type === 'file' && isThumbnailFile(i.name));
            // گروه‌بندی ویدیوها بر اساس نام پایه (برای ویدیوهای چندبخشی)
            const groups = new Map();
            for (const file of videoFiles) {
                let base = file.name.replace(/_(part\d+)/i, '').replace(/\.\w+$/, '');
                if (!groups.has(base)) groups.set(base, []);
                groups.get(base).push({ name: file.name, path: file.path });
            }
            const shortsData = [];
            for (let [base, files] of groups.entries()) {
                files.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
                const urls = files.map(f => getStreamableUrl(f.path));
                // یافتن تامبنیل مرتبط: هر فایل تصویری که نامش حاوی base باشد یا اولین تصویر
                let thumbFile = thumbnailFiles.find(t => t.name.includes(base) || (thumbnailFiles.length > 0 && !thumbnailFiles[0]));
                if (!thumbFile && thumbnailFiles.length) thumbFile = thumbnailFiles[0];
                const thumbnailUrl = thumbFile ? getStreamableUrl(thumbFile.path) : null;
                shortsData.push({
                    id: base,
                    title: base.replace(/_/g, ' '),
                    parts: urls,
                    totalParts: urls.length,
                    thumbnail: thumbnailUrl
                });
            }
            return shortsData;
        } catch (err) {
            console.error("خطا در بارگذاری Shorts:", err);
            return [];
        }
    }

    function renderVideoGrid(items, type) {
        if (!items.length) {
            contentContainer.innerHTML = `<div class="empty-state">📭 هیچ ویدیویی در این بخش یافت نشد.</div>`;
            return;
        }
        const grid = document.createElement('div');
        grid.className = 'library-grid';
        for (const item of items) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.setAttribute('data-id', item.id);
            const thumbDiv = document.createElement('div');
            thumbDiv.className = 'thumbnail';
            if (item.thumbnail) {
                const img = document.createElement('img');
                img.src = item.thumbnail;
                img.alt = item.title;
                img.loading = 'lazy';
                img.onerror = () => { // در صورت خطا، پلاهولدر نشان بده
                    img.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'thumbnail-placeholder';
                    placeholder.innerHTML = `<div>${type === 'long' ? '🎬' : '📱'}</div><span>${item.totalParts} قطعه</span>`;
                    thumbDiv.appendChild(placeholder);
                };
                thumbDiv.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'thumbnail-placeholder';
                placeholder.innerHTML = `<div>${type === 'long' ? '🎬' : '📱'}</div><span>${item.totalParts > 1 ? item.totalParts + ' قطعه' : 'Short'}</span>`;
                thumbDiv.appendChild(placeholder);
            }
            if (item.totalParts > 1) {
                const badge = document.createElement('div');
                badge.className = 'duration-badge';
                badge.innerText = `${item.totalParts} قسمت`;
                thumbDiv.appendChild(badge);
            }
            const infoDiv = document.createElement('div');
            infoDiv.className = 'card-info';
            const titleSpan = document.createElement('div');
            titleSpan.className = 'card-title';
            titleSpan.innerText = item.title.length > 60 ? item.title.slice(0,57)+'...' : item.title;
            const metaSpan = document.createElement('div');
            metaSpan.className = 'card-meta';
            metaSpan.innerText = type === 'long' ? `${item.totalParts} قسمت` : `${item.totalParts} قطعه`;
            infoDiv.appendChild(titleSpan);
            infoDiv.appendChild(metaSpan);
            card.appendChild(thumbDiv);
            card.appendChild(infoDiv);
            card.addEventListener('click', () => playSelectedItem(item, type));
            grid.appendChild(card);
        }
        contentContainer.innerHTML = '';
        contentContainer.appendChild(grid);
    }

    let currentPlayer = null;
    let endedHandler = null;
    let currentPlaylist = null; // برای مدیریت قطع پخش هنگام تعویض تب

    const playerVideo = document.getElementById('smartPlayer');
    const playerSection = document.getElementById('playerSection');
    const playerTitle = document.getElementById('playerTitle');

    function playSelectedItem(item, type) {
        if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
        if (currentPlayer) currentPlayer.destroy();
        playerVideo.pause();
        if (item.parts.length === 1) {
            playerVideo.src = item.parts[0];
            playerTitle.innerText = item.title;
            playerSection.classList.remove('hidden');
            playerVideo.load();
            playerVideo.play().catch(e=>console.warn(e));
            currentPlayer = new Plyr(playerVideo);
        } else {
            let currentPartIndex = 0;
            const playPart = (index) => {
                if (index >= item.parts.length) return;
                playerVideo.src = item.parts[index];
                playerTitle.innerText = `${item.title} (بخش ${index+1}/${item.parts.length})`;
                playerVideo.load();
                playerVideo.play().catch(e=>console.warn(e));
                if (currentPlayer) currentPlayer.destroy();
                currentPlayer = new Plyr(playerVideo);
                if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
                endedHandler = () => playPart(index + 1);
                playerVideo.addEventListener('ended', endedHandler);
            };
            playPart(0);
            playerSection.classList.remove('hidden');
        }
    }

    // مدیریت تب‌ها و تاریخچه بازگشت
    let tabHistory = ['videos']; // تاریخچه تب‌ها
    let currentTab = 'videos';

    async function renderCurrentTab() {
        contentContainer.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>در حال بارگذاری...</div></div>`;
        let items = [];
        if (currentTab === 'videos') {
            items = await loadLongVideos();
            renderVideoGrid(items, 'long');
        } else {
            items = await loadShortVideos();
            renderVideoGrid(items, 'short');
        }
        document.getElementById('currentPathDisplay').innerText = currentTab === 'videos' ? '📁 ویدیوهای بلند' : '📱 Shorts';
    }

    function switchTab(tab) {
        if (tab === currentTab) return;
        // ذخیره در تاریخچه
        tabHistory.push(tab);
        currentTab = tab;
        // به‌روزرسانی UI تب
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderCurrentTab();
        // بستن پلیر در هنگام تغییر تب
        playerSection.classList.add('hidden');
        if (playerVideo.src) playerVideo.pause();
        if (currentPlayer) currentPlayer.destroy();
        if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
    }

    function goBack() {
        if (tabHistory.length > 1) {
            tabHistory.pop(); // حذف فعلی
            const prevTab = tabHistory.pop();
            if (prevTab) {
                currentTab = prevTab;
                // به‌روزرسانی دکمه‌های تب
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    if (btn.getAttribute('data-tab') === prevTab) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
                renderCurrentTab();
                // بستن پلیر
                playerSection.classList.add('hidden');
                if (playerVideo.src) playerVideo.pause();
                if (currentPlayer) currentPlayer.destroy();
                if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
                // دوباره تب قبلی رو به تاریخچه اضافه نکنیم چون در switchTab دوباره اضافه می‌شه
                // اما برای جلوگیری از دوباره کاری، history رو درست می‌کنیم
                tabHistory = [prevTab]; // ریست ساده
            }
        } else {
            // اگر چیزی نبود، به تب ویدیوهای بلند برو
            if (currentTab !== 'videos') switchTab('videos');
        }
    }

    function goHome() {
        // بازنشانی به تب ویدیوهای بلند و پیمایش به بالا
        if (currentTab !== 'videos') switchTab('videos');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // پاک کردن تاریخچه
        tabHistory = ['videos'];
    }

    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                switchTab(tab);
            });
        });
    }

    function initDomainSwitch() {
        const btns = document.querySelectorAll('#domainSwitch button');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDomain = btn.getAttribute('data-domain');
                renderCurrentTab();
                // بستن پلیر
                playerSection.classList.add('hidden');
                if (playerVideo.src) playerVideo.pause();
                if (currentPlayer) currentPlayer.destroy();
                if (endedHandler) playerVideo.removeEventListener('ended', endedHandler);
            });
        });
    }

    // دکمه‌های ناوبری
    document.getElementById('backBtn').addEventListener('click', goBack);
    document.getElementById('homeBtn').addEventListener('click', goHome);

    (async function init() {
        initTabs();
        initDomainSwitch();
        await renderCurrentTab();
        playerVideo.addEventListener('error', (e) => {
            console.error("خطا در پخش ویدیو. ممکن است دامنه انتخاب شده مسدود باشد.", e);
            alert("خطا در پخش. لطفاً دامنه دیگر را امتحان کنید.");
        });
    })();
</script>
</body>
</html>
