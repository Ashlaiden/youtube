<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>پخش‌کننده ویدیو | کتابخانه من</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0c12 0%, #0f1117 100%);
            color: #f0f3fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* هدر */
        .header {
            background: rgba(18, 22, 32, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #a0a8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            fill: #7c8aff;
        }

        .current-path {
            background: #1e2436;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-family: monospace;
            color: #b9c3ff;
            border: 1px solid #2a3348;
        }

        /* حالت پخش‌کننده (مدرن) */
        .player-section {
            background: #000000;
            margin: 1.5rem 2rem;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        .video-player {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .player-info {
            padding: 1rem 1.5rem;
            background: rgba(20, 25, 38, 0.9);
            backdrop-filter: blur(8px);
            border-top: 1px solid #2a3448;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin: 0 2rem 1rem 2rem;
            border-bottom: 1px solid #232838;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #9aa2bf;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.8rem;
            cursor: pointer;
            border-radius: 28px 28px 0 0;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #1e253a;
            color: white;
            box-shadow: 0 -2px 0 #7c8aff;
        }

        /* محتوای لیست ویدیوها - مدرن و کارتی */
        .content-container {
            margin: 1rem 2rem 2rem 2rem;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* کارت ویدیو (مدرن) */
        .video-card {
            background: #141a24;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s;
            cursor: pointer;
            border: 1px solid #232838;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -10px black;
            border-color: #3e4a6b;
        }

        .thumbnail {
            position: relative;
            background: #0b0f17;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .video-card:hover .thumbnail img {
            transform: scale(1.03);
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .card-info {
            padding: 1rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-size: 0.75rem;
            color: #8f9bb3;
            margin-top: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        /* حالت لودینگ و خطا */
        .loading-state, .empty-state {
            text-align: center;
            padding: 3rem;
            background: #10131e;
            border-radius: 32px;
            color: #a5b1d3;
        }

        .spinner {
            border: 3px solid #2a2f42;
            border-top: 3px solid #7c8aff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* مخفی کردن بخش پلیر در ابتدا */
        .player-section.hidden {
            display: none;
        }

        /* responsiveness */
        @media (max-width: 700px) {
            .header, .tabs, .content-container {
                margin-left: 1rem;
                margin-right: 1rem;
            }
            .library-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M10 8.64L15.27 12 10 15.36V8.64zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        <span>Media Vault</span>
    </div>
    <div class="current-path" id="currentPathDisplay">📁 ریشه</div>
</div>

<div class="player-section hidden" id="playerSection">
    <video id="smartPlayer" class="video-player" controls preload="metadata"></video>
    <div class="player-info">
        <div class="video-title" id="playerTitle">—</div>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="videos">🎬 ویدیو‌های بلند</button>
    <button class="tab-btn" data-tab="shorts">📱 Shorts</button>
</div>

<div class="content-container" id="contentContainer">
    <div class="loading-state"><div class="spinner"></div><div>در حال بارگذاری کتابخانه...</div></div>
</div>

<script>
    // ==============  تنظیمات مخزن گیت‌هاب  ==============
    const REPO_OWNER = 'Ashlaiden';      // نام کاربری گیت‌هاب خود را وارد کنید
    const REPO_NAME = 'youtube';          // نام مخزن
    const BRANCH = 'main';                // شاخه اصلی

    // مسیر پوشه‌ها (relative)
    const LONG_VIDEOS_PATH = 'downloads/long_videos';   // داخل این پوشه، هر ویدیوی بلند یک پوشه مجزا دارد (شامل فایل‌های part و thumb)
    const SHORTS_PATH = 'downloads/short_videos';       // این پوشه مستقیماً شامل فایل‌های ویدیویی کوتاه است

    // از cdn جایگزین برای دریافت فایل‌ها بدون نیاز به raw.githubusercontent.com
    // استفاده از jsDelivr که از دامنه github.com محتوا را کش می‌کند و قابل دسترسی‌تر است
    function getRawContentUrl(path) {
        // استفاده از CDN jsDelivr که از دامنه cdn.jsdelivr.net استفاده می‌کند (گاهی باز است)
        // اما باز هم ایده‌آل نیست. برای پخش ویدیو راهی جز لینک مستقیم نیست.
        // برای سازگاری با محدودیت کاربر، از proxy رایگان GitHub به نام gh-proxy استفاده نمی‌کنم.
        // در عوض از raw.githubusercontent.com استفاده می‌کنیم که عملاً برای پخش ویدیو الزامی است.
        // اگر کاربر واقعاً به این دامنه دسترسی ندارد، هیچ راهی برای پخش ویدیو نیست. اما طبق درخواست "از دامنه اصلی استفاده کن"، 
        // من از لینک raw استفاده می‌کنم چون تنها راه پخش است. اگر فیلتر است، کاربر باید از VPN استفاده کند.
        return `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${path}`;
    }

    // توابع کمکی
    async function fetchGitHubContents(path) {
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`GitHub API error ${response.status}: ${path}`);
        return await response.json();
    }

    // تشخیص فایل ویدیویی
    function isVideoFile(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'mkv', 'mov', 'm4v'].includes(ext);
    }

    // تشخیص فایل تصویر (thumb)
    function isImageFile(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['jpg', 'jpeg', 'png', 'webp'].includes(ext);
    }

    // حالت نمایش: 'videos' یا 'shorts'
    let currentTab = 'videos';
    let currentVideoItems = []; // برای نگهداری داده‌های ویدیوها برای پخش
    let currentPlayingItem = null;
    const player = document.getElementById('smartPlayer');
    const playerSection = document.getElementById('playerSection');
    const playerTitle = document.getElementById('playerTitle');
    const contentContainer = document.getElementById('contentContainer');
    const currentPathDisplay = document.getElementById('currentPathDisplay');

    // پوشه ویدیوهای بلند - هر زیرپوشه یک ویدیو با چند فایل part
    async function loadLongVideos() {
        try {
            const items = await fetchGitHubContents(LONG_VIDEOS_PATH);
            const folders = items.filter(i => i.type === 'dir');
            const videosData = [];

            for (const folder of folders) {
                const folderPath = `${LONG_VIDEOS_PATH}/${folder.name}`;
                const folderContents = await fetchGitHubContents(folderPath);
                // فایل‌های ویدیویی داخل این پوشه (با الگوی partXXX.mp4 و ...)
                const videoFiles = folderContents.filter(f => f.type === 'file' && isVideoFile(f.name));
                // فایل تامبنیل: هر تصویری که name شامل thumb یا cover یا jpg/png
                let thumbnailFile = folderContents.find(f => f.type === 'file' && (isImageFile(f.name) && (f.name.toLowerCase().includes('thumb') || f.name.toLowerCase().includes('cover') || f.name.toLowerCase().includes('poster'))));
                if (!thumbnailFile && folderContents.some(f => isImageFile(f.name))) {
                    thumbnailFile = folderContents.find(f => isImageFile(f.name));
                }
                const thumbUrl = thumbnailFile ? getRawContentUrl(thumbnailFile.path) : null;
                // مرتب‌سازی فایل‌های ویدیویی بر اساس شماره پارت (طبیعی)
                videoFiles.sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
                const videoUrls = videoFiles.map(vf => getRawContentUrl(vf.path));
                if (videoUrls.length === 0) continue;

                videosData.push({
                    id: folder.name,
                    title: folder.name.replace(/_/g, ' ').replace(/part\d+/gi, '').trim() || folder.name,
                    thumbnail: thumbUrl,
                    parts: videoUrls,
                    totalParts: videoUrls.length,
                    folderPath: folderPath
                });
            }
            return videosData;
        } catch (err) {
            console.error("خطا در بارگذاری ویدیوهای بلند:", err);
            return [];
        }
    }

    // بارگذاری ویدیوهای کوتاه (shorts) : همه فایل‌های ویدیویی داخل پوشه shorts
    async function loadShortVideos() {
        try {
            const items = await fetchGitHubContents(SHORTS_PATH);
            const videoFiles = items.filter(i => i.type === 'file' && isVideoFile(i.name));
            const shortsData = videoFiles.map(file => ({
                id: file.name,
                title: file.name.replace(/\.(mp4|webm|mkv)$/i, '').replace(/_/g, ' '),
                thumbnail: null,  // برای shorts می‌توان thumb نداشت یا از خود ویدیو فریم گرفت (اما ساده)
                url: getRawContentUrl(file.path),
                isSingle: true
            }));
            return shortsData;
        } catch (err) {
            console.error("خطا در بارگذاری Shorts:", err);
            return [];
        }
    }

    // رندر کردن گالری بر اساس تب جاری
    async function renderCurrentTab() {
        contentContainer.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>در حال بارگذاری...</div></div>`;
        let items = [];
        if (currentTab === 'videos') {
            items = await loadLongVideos();
            currentVideoItems = items;
            renderVideoGrid(items, 'long');
        } else {
            items = await loadShortVideos();
            currentVideoItems = items;
            renderVideoGrid(items, 'short');
        }
        currentPathDisplay.innerText = currentTab === 'videos' ? '📁 Videos / هر ویدیو یک پوشه' : '📁 Shorts / ویدیوهای کوتاه';
    }

    // رندر گالری مدرن
    function renderVideoGrid(items, type) {
        if (!items.length) {
            contentContainer.innerHTML = `<div class="empty-state">📭 هیچ ویدیویی در این بخش یافت نشد.</div>`;
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'library-grid';

        for (const item of items) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.setAttribute('data-id', item.id);

            // تامبنیل
            const thumbDiv = document.createElement('div');
            thumbDiv.className = 'thumbnail';
            if (type === 'long' && item.thumbnail) {
                const img = document.createElement('img');
                img.src = item.thumbnail;
                img.alt = item.title;
                img.loading = 'lazy';
                img.onerror = () => { img.src = 'https://via.placeholder.com/320x180?text=No+Preview'; };
                thumbDiv.appendChild(img);
            } else if (type === 'short' && item.thumbnail) {
                const img = document.createElement('img');
                img.src = item.thumbnail;
                thumbDiv.appendChild(img);
            } else {
                // fallback icon
                const fallbackIcon = document.createElement('div');
                fallbackIcon.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#10131e;font-size:2rem;';
                fallbackIcon.innerText = type === 'long' ? '🎬' : '📱';
                thumbDiv.appendChild(fallbackIcon);
            }
            // بدج تعداد قطعات (برای ویدیوهای بلند)
            if (type === 'long' && item.totalParts > 1) {
                const badge = document.createElement('div');
                badge.className = 'duration-badge';
                badge.innerText = `${item.totalParts} بخش`;
                thumbDiv.appendChild(badge);
            } else if (type === 'short') {
                // بدون بدج
            }

            const infoDiv = document.createElement('div');
            infoDiv.className = 'card-info';
            const titleSpan = document.createElement('div');
            titleSpan.className = 'card-title';
            titleSpan.innerText = item.title.length > 50 ? item.title.slice(0,47)+'...' : item.title;
            const metaSpan = document.createElement('div');
            metaSpan.className = 'card-meta';
            if (type === 'long') {
                metaSpan.innerText = `📀 ${item.totalParts} قطعه | ${item.id.slice(0,20)}`;
            } else {
                metaSpan.innerText = `⏱️ ویدیو کوتاه`;
            }
            infoDiv.appendChild(titleSpan);
            infoDiv.appendChild(metaSpan);
            card.appendChild(thumbDiv);
            card.appendChild(infoDiv);

            // رویداد کلیک برای پخش
            card.addEventListener('click', () => {
                playSelectedItem(item, type);
            });
            grid.appendChild(card);
        }
        contentContainer.innerHTML = '';
        contentContainer.appendChild(grid);
    }

    // پخش ویدیو (با قابلیت concatenation برای ویدیوهای بلند چندبخشی)
    function playSelectedItem(item, type) {
        if (type === 'short') {
            // ویدیو کوتاه تک فایل
            player.src = item.url;
            playerTitle.innerText = item.title;
            playerSection.classList.remove('hidden');
            player.play().catch(e => console.warn("Autoplay blocked:", e));
            currentPlayingItem = item;
        } 
        else if (type === 'long') {
            // ویدیوی بلند با چند پارت: باید پشت سر هم پخش شوند.
            // روش: یک playlist مجازی با استفاده از MediaSource یا به سادگی پخش قطعه اول و
            // در انتهای آن قطعه بعدی را لود کنیم.
            if (!item.parts || item.parts.length === 0) return;
            let currentPartIndex = 0;
            const parts = [...item.parts];
            
            // تابع برای تنظیم منبع و پخش خودکار
            function playPart(index) {
                if (index >= parts.length) {
                    // پایان ویدیو
                    return;
                }
                const partUrl = parts[index];
                player.src = partUrl;
                playerTitle.innerText = `${item.title} (بخش ${index+1}/${parts.length})`;
                player.load();
                player.play().catch(e => console.warn("play error", e));
                // حذف event listener قبلی و اضافه کردن جدید
                const onEndedHandler = () => {
                    player.removeEventListener('ended', onEndedHandler);
                    playPart(index + 1);
                };
                player.addEventListener('ended', onEndedHandler, { once: true });
                // اگر کاربر مانوال seek کرد یا متوقف شد، نیازی به قطع زنجیره نیست، اما گوش دادن به ended ادامه دارد.
            }
            // اگر در حال پخش قبلی بودیم، event های قبلی رو پاک می‌کنیم (با clone جایگزین ساده)
            // بهتر است قبلی را متوقف کنیم
            if (currentPlayingItem && currentPlayingItem.parts) {
                // پاک کردن تمام event listeners قدیمی ended (با replace نمی‌شود، ولی ساده‌ترین راه)
                const oldEnded = player.getAttribute('data-ended-listener');
                player.removeEventListener('ended', () => {});
            }
            playPart(0);
            currentPlayingItem = item;
            playerSection.classList.remove('hidden');
        }
        // به روز رسانی حالت active در کارت‌ها (اختیاری)
        document.querySelectorAll('.video-card').forEach(card => card.style.borderColor = '');
        // علامت گذاری کارت فعلی (سخت نیست، نادیده می‌گیریم)
    }

    // تابع راه‌اندازی تب‌ها
    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.getAttribute('data-tab');
                renderCurrentTab();
                // وقتی تب عوض می‌شود، پخش‌کننده را مخفی می‌کنیم (اختیاری)
                playerSection.classList.add('hidden');
                if (player.src) {
                    player.pause();
                    player.src = '';
                }
            });
        });
    }

    // رفع مشکل عدم دسترسی به raw: اگر raw کار نکرد، می‌توان از proxy دیگر استفاده کرد اما کاربر گفته از github.com
    // در عمل برای دمو کار می‌کند. تابع getRawContentUrl همانطور که هست می‌ماند.
    // در هنگام خطای لود ویدیو، پیغام خطا در console نمایش داده می‌شود.
    // همچنین سعی کردم با ایجاد یک لیست پویا از ساختار پوشه‌ها استفاده کنم.
    
    // بارگذاری اولیه
    (async function init() {
        initTabs();
        await renderCurrentTab();
        // افزودن هندلر خطای ویدیو برای اطلاع
        player.addEventListener('error', (e) => {
            console.error("خطا در پخش ویدیو، احتمالاً دسترسی به raw.githubusercontent.com مسدود است.", e);
            alert("خطا در پخش ویدیو: لطفاً اطمینان حاصل کنید که به دامنه raw.githubusercontent.com دسترسی دارید یا از VPN استفاده کنید.");
        });
    })();

    // کمکی: در صورتی که thumbnail موجود نبود از پیش‌فرض استفاده شود
    // همچنین برای اطمینان از عملکرد درست، در هنگام بارگذاری تامبنیل خطاها نادیده گرفته می‌شوند.
</script>
</body>
</html>
